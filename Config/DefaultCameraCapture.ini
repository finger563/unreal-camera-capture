; Plugin config, merged into the engine hierarchy, so the migrations below travel
; with the plugin instead of depending on each consuming project to repeat them.

[CoreRedirects]
; ERammsCaptureMode::ColorPlusDepthMotion became TonemappedColorPlusDepth when
; motion moved out of that pass into one of its own. The enum keeps its original
; ordinals, so a value-based load already resolves; this covers the name-based
; path, which would otherwise fall back to 0 rather than resolve.
+EnumRedirects=(OldName="ERammsCaptureMode",ValueChanges=(("ColorPlusDepthMotion","TonemappedColorPlusDepth")))
